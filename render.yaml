# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: emotion-ai-backend
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    # Start command comes from Dockerfile ENTRYPOINT (render-entrypoint.sh)
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_DEVICE
        value: cpu
      - key: MODEL_WARMUP
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_IMAGE_SIZE_MB
        value: "8"
      - key: TORCH_NUM_THREADS
        value: "2"
      - key: VIDEO_FRAME_SKIP
        value: "5"
      - key: VIDEO_MIN_CONFIDENCE_DELTA
        value: "0.05"
      - key: FACE_DETECTION_BACKEND
        value: auto
      - key: MODEL_DOWNLOAD_TIMEOUT_SECONDS
        value: "120"
      - key: MEDIAPIPE_FACE_MODEL_PATH
        value: data/mediapipe_models/blaze_face_full_range.tflite
